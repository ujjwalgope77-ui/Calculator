name: Build Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Python 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. System dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libbz2-dev \
            liblzma-dev \
            libreadline-dev \
            libgdbm-dev \
            libdb-dev \
            uuid-dev \
            tk-dev

      # 5. Rust
      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version

      # 6. Install Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install --upgrade buildozer cython

      # 7. Force SDK license acceptance
      - name: Enable Android SDK license acceptance
        run: |
          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i 's/^android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec
          else
            sed -i '/^fullscreen =/a android.accept_sdk_license = True' buildozer.spec
          fi

          echo "Android SDK license setting:"
          grep "android.accept_sdk_license" buildozer.spec

      # 8. Initialize Android SDK and accept licenses
      - name: Initialize Android SDK
        run: |
          buildozer android p4a -- --help

      # 9. Clean old build files
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

      # 10. Build APK
      - name: Build Android APK
        run: |
          buildozer android debug

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
